# Configuração do experimento "Pokemon with stats" — dataset mais desafiador
# que o Iris, usado para comparar o CBA-RG com e sem discretização dos
# atributos contínuos (ver docs/PIBIC___João_e_Fábio.pdf).
#
# ~800 linhas (inclui formas "Mega" como linhas extras da mesma espécie
# base — não filtradas por enquanto). Classe Legendary é fortemente
# desbalanceada (~8% True), então além da acurácia o runner também registra
# recall da classe positiva e uso da classe padrão (ver seção 7.2 do
# relatório: em forte desbalanceamento, acurácia sozinha engana).

dataset_path: datasets/Pokemon.csv
csv_sep: ";"
id_column: "#"
class_column: Legendary
positive_class: "True"

# Apenas os 6 stats numéricos contínuos como preditores — ignora Name,
# Type 1, Type 2, Total (redundante: soma dos outros seis) e Generation
# para isolar o efeito da discretização sobre atributos contínuos.
feature_columns:
  - HP
  - Attack
  - Defense
  - Sp. Atk
  - Sp. Def
  - Speed
continuous_columns:
  - HP
  - Attack
  - Defense
  - Sp. Atk
  - Sp. Def
  - Speed

# Discretização por igual-frequência. Pode ser desligada por linha de
# comando com --sem-discretizar (ver runner.py) para comparar o efeito.
discretizar: true
n_bins: 3

# Limiares do CBA-RG. min_support mais baixo que o do Iris porque a classe
# positiva (Legendary=True) já é só ~8% dos dados — um minsup alto faria o
# CBA-RG nunca considerar itemsets restritos a ela, discretização ou não.
min_support: 0.03
min_confidence: 0.5
max_antecedent_length: 3

# Validação cruzada estratificada.
k_folds: 5
seed: 42

# Variante do CBA-CB (construção do classificador a partir das CARs geradas
# pelo CBA-RG, que é o mesmo nos dois casos): "m1" é a cobertura clássica
# ordenada por confiança/suporte (Liu, Hsu & Ma, 1998); "cba_qs" usa o
# escore multicritério S(r) de fase2_implementacao/cba_qs.py (Fase 3 do
# projeto), pensado para não deixar regras da classe minoritária serem
# sempre enterradas por regras "óbvias" da classe majoritária. Pode ser
# sobrescrito por linha de comando com --cb-variant.
cb_variant: m1
# Pesos [w1, w2, w3, w4] do CBA-QS (ver docstring de cba_qs.py). O
# documento do projeto não sugere valores padrão; null usa pesos iguais
# (0.25 cada), a decisão inicial explícita até a fase de ablação.
cba_qs_weights: null
